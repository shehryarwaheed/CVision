  <style>
    :root {
      /* Motion Timing Tokens */
      --cv-duration-fast: 280ms;
      --cv-duration-base: 560ms;
      --cv-duration-slow: 840ms;
      --cv-duration-ambient: 24s;

      /* Shared Easing Curves */
      --cv-ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --cv-ease-spring: cubic-bezier(0.34, 1.25, 0.64, 1);
      --cv-ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);

      /* Spatial Travel Distances */
      --cv-dist-sm: 12px;
      --cv-dist-base: 24px;
      --cv-dist-lg: 36px;

      /* Light Theme Palette Tokens */
      --cv-bg-base: #f0f9ff;
      --cv-grad-field-1: radial-gradient(ellipse 75% 65% at 0% 0%, rgba(219, 242, 255, 0.85), transparent 70%);
      --cv-grad-field-2: radial-gradient(ellipse 65% 55% at 100% 5%, rgba(238, 242, 255, 0.75), transparent 65%);
      --cv-grad-field-3: radial-gradient(circle at 60% 50%, rgba(245, 243, 255, 0.55), transparent 60%);
      --cv-grad-field-4: radial-gradient(ellipse 80% 50% at 20% 100%, rgba(204, 251, 241, 0.50), transparent 70%);
      --cv-grad-linear: linear-gradient(180deg, rgba(255, 255, 255, 0.6) 0%, rgba(240, 249, 255, 0.3) 50%, rgba(224, 242, 254, 0.4) 100%);
    }

    .dark {
      /* Dark Theme Palette Tokens */
      --cv-bg-base: #05161A;
      --cv-grad-field-1: radial-gradient(ellipse 70% 60% at 5% 5%, rgba(6, 46, 55, 0.70), transparent 70%);
      --cv-grad-field-2: radial-gradient(ellipse 60% 55% at 95% 10%, rgba(8, 60, 71, 0.55), transparent 65%);
      --cv-grad-field-3: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.04), transparent 60%);
      --cv-grad-field-4: radial-gradient(ellipse 80% 50% at 50% 100%, rgba(4, 28, 34, 0.85), transparent 75%);
      --cv-grad-linear: linear-gradient(180deg, rgba(5, 22, 26, 0.3) 0%, rgba(8, 37, 44, 0.15) 50%, rgba(5, 22, 26, 0.5) 100%);
    }

    /* Accessibility: Reduced-Motion Guarantee */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .animate-blob-1,
      .animate-blob-2,
      .animate-blob-3,
      .animate-shimmer,
      .cv-ambient-blob-1,
      .cv-ambient-blob-2,
      .cv-ambient-blob-3,
      .cv-ambient-drift {
        animation: none !important;
        transform: none !important;
      }
      .cv-motion-ready .cv-reveal,
      .cv-motion-ready .cv-reveal-pop,
      .cv-motion-ready .cv-mask-inner {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
        transition: none !important;
      }
    }

    *:not(.cv-motion):not(.cv-motion *) {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease, box-shadow 0.2s ease;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(14, 165, 233, 0.4);
      border-radius: 9999px;
    }
    .score-circle {
      stroke-dasharray: 283;
      stroke-dashoffset: calc(283 - (283 * var(--score-val, 86)) / 100);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Stitch Fluid Mesh & Shimmer Animations */
    @keyframes blobFloat1 {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(60px, -45px) scale(1.12); }
      100% { transform: translate(-30px, 35px) scale(0.95); }
    }
    @keyframes blobFloat2 {
      0% { transform: translate(0px, 0px) scale(1.05); }
      50% { transform: translate(-70px, 50px) scale(0.92); }
      100% { transform: translate(40px, -40px) scale(1.15); }
    }
    @keyframes blobFloat3 {
      0% { transform: translate(0px, 0px) scale(0.98); }
      50% { transform: translate(45px, 60px) scale(1.1); }
      100% { transform: translate(-50px, -30px) scale(1); }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(200%); }
    }
    .animate-blob-1 { animation: blobFloat1 18s ease-in-out infinite alternate; }
    .animate-blob-2 { animation: blobFloat2 22s ease-in-out infinite alternate; }
    .animate-blob-3 { animation: blobFloat3 16s ease-in-out infinite alternate; }
    .animate-shimmer { animation: shimmer 3s ease-in-out infinite; }

    /* Ambient Drift Keyframes (low-amplitude, transform-only) */
    @keyframes cvDrift1 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(22px, -16px, 0) scale(1.03); }
      100% { transform: translate3d(-14px, 12px, 0) scale(0.98); }
    }
    @keyframes cvDrift2 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(-24px, 20px, 0) scale(0.97); }
      100% { transform: translate3d(16px, -14px, 0) scale(1.04); }
    }
    @keyframes cvDrift3 {
      0% { transform: translate3d(0, 0, 0) scale(1); }
      50% { transform: translate3d(14px, 18px, 0) scale(1.02); }
      100% { transform: translate3d(-20px, -10px, 0) scale(0.98); }
    }

    .cv-ambient-blob-1 {
      animation: cvDrift1 var(--cv-duration-ambient) ease-in-out infinite alternate;
      will-change: transform;
    }
    .cv-ambient-blob-2 {
      animation: cvDrift2 28s ease-in-out infinite alternate;
      will-change: transform;
    }
    .cv-ambient-blob-3 {
      animation: cvDrift3 22s ease-in-out infinite alternate;
      will-change: transform;
    }

    /* Fine SVG Grain Overlay (3.5% opacity, anti-banding shield) */
    .cv-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      background-size: 160px 160px;
    }

    /* =========================================================================
       Reveal System: Entrances, Stagger Delays & Title Masks (Increment 3)
       ========================================================================= */

    /* Line-by-Line Masked Typography Reveal */
    .cv-mask-line {
      display: block;
      overflow: hidden;
      vertical-align: top;
    }
    .cv-motion-ready .cv-mask-inner {
      display: inline-block;
      transform: translateY(115%);
      transition: transform var(--cv-duration-slow) var(--cv-ease-out);
      will-change: transform;
    }
    .cv-in-view .cv-mask-inner,
    .cv-mask-line.cv-in-view .cv-mask-inner {
      transform: translateY(0%);
    }

    /* Rise-and-Fade Standard Card & Section Entrance */
    .cv-motion-ready .cv-reveal {
      opacity: 0;
      transform: translateY(var(--cv-dist-base));
      filter: blur(4px);
      transition: opacity var(--cv-duration-base) var(--cv-ease-out),
                  transform var(--cv-duration-base) var(--cv-ease-out),
                  filter var(--cv-duration-base) var(--cv-ease-out);
      will-change: opacity, transform, filter;
    }
    .cv-reveal.cv-in-view,
    .cv-in-view .cv-reveal {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }

    /* Blur-to-Sharp & Spring Scale-in (Key Metric Tiles & Scorecard) */
    .cv-motion-ready .cv-reveal-pop {
      opacity: 0;
      transform: scale(0.95) translateY(var(--cv-dist-sm));
      filter: blur(6px);
      transition: opacity var(--cv-duration-base) var(--cv-ease-spring),
                  transform var(--cv-duration-base) var(--cv-ease-spring),
                  filter var(--cv-duration-base) var(--cv-ease-out);
      will-change: opacity, transform, filter;
    }
    .cv-reveal-pop.cv-in-view,
    .cv-in-view .cv-reveal-pop {
      opacity: 1;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    /* Staggered Delay Chains */
    .cv-stagger > *:nth-child(1) { transition-delay: 50ms; }
    .cv-stagger > *:nth-child(2) { transition-delay: 110ms; }
    .cv-stagger > *:nth-child(3) { transition-delay: 170ms; }
    .cv-stagger > *:nth-child(4) { transition-delay: 230ms; }
    .cv-stagger > *:nth-child(5) { transition-delay: 290ms; }
    .cv-stagger > *:nth-child(6) { transition-delay: 350ms; }
    .cv-stagger > *:nth-child(7) { transition-delay: 410ms; }
    .cv-stagger > *:nth-child(8) { transition-delay: 470ms; }
    
    @keyframes pageSlideIn {
      from { opacity: 0; transform: translateY(8px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-page {
      animation: pageSlideIn 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Custom Backdrop & Specular Light Reflections */
    .glass-specular {
      background: radial-gradient(120% 120% at 50% 0%, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.03) 70%, transparent 100%);
    }
    .dark .glass-specular {
      background: radial-gradient(120% 120% at 50% 0%, rgba(34, 211, 238, 0.16) 0%, rgba(45, 212, 191, 0.03) 65%, transparent 100%);
    }

    /* Ambient noise overlay for organic depth */
    .noise-bg {
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
    }
    .dark .noise-bg {
      background-image: radial-gradient(rgba(34, 211, 238, 0.07) 1px, transparent 0);
      background-size: 28px 28px;
    }
  </style>
</head>

    const apiService = {
      rewriteBullet: async ({ bullet, role, jd_keywords, tone }) => {
        try {
          const resp = await fetch("/api/rewrite", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ bullet, role, jd_keywords, tone })
          });
          if (!resp.ok) throw new Error("HTTP " + resp.status);
          return await resp.json();

          console.warn("apiService.rewriteBullet fallback:", err);
          const cleanClause = bullet.replace(/^(responsible for|worked on|helped|assisted|handled|duties included)\s*/i, '');

            why_weak: "Starts with passive duty phrasing and contains no measurable outcome metrics.",

            >

            </span>
          );
        }
        return <span key={i}>{part}</span>;
      });
    }

    // =========================================================================
    // Scroll Position Tracking Hook (for Scroll Parallax & Scrubbing)
    // =========================================================================
    function useScrollPosition() {
      const [scrollY, setScrollY] = useState(0);

      useEffect(() => {
        let ticking = false;
        const onScroll = () => {
          if (!ticking) {
            window.requestAnimationFrame(() => {
              setScrollY(window.pageYOffset || document.documentElement.scrollTop || 0);
              ticking = false;
            });
            ticking = true;
          }
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      return scrollY;
    }

    // =========================================================================
    // IntersectionObserver Scroll Reveal Hook (Increment 3)
    // =========================================================================
    function useScrollReveal(dependencies = []) {
      useEffect(() => {
        const elements = document.querySelectorAll(
          '.cv-reveal:not(.cv-in-view), .cv-reveal-pop:not(.cv-in-view), .cv-mask-line:not(.cv-in-view)'
        );
        if (!elements.length) return;

        if (!('IntersectionObserver' in window)) {
          elements.forEach(el => el.classList.add('cv-in-view'));
          return;
        }

        const observer = new IntersectionObserver(
          (entries, obs) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                entry.target.classList.add('cv-in-view');
                obs.unobserve(entry.target);
              }
            });
          },
          {
            root: null,
            rootMargin: '0px 0px -40px 0px',
            threshold: 0.1
          }
        );

        elements.forEach(el => observer.observe(el));

        return () => observer.disconnect();
      }, dependencies);
    }

    // =========================================================================
    // AI Bullet Rewriter / CV Coach: Guided Chat Popup Component
    // =========================================================================
    function CVCoachWidget({ isDark, activeData, onAcceptRewrite, externalTrigger }) {
      const [isOpen, setIsOpen] = useState(false);
      const [isMinimized, setIsMinimized] = useState(false);
      const [messages, setMessages] = useState([]);
      const [isTyping, setIsTyping] = useState(false);
      const [inputVal, setInputVal] = useState("");
      const [activeBulletIdx, setActiveBulletIdx] = useState(0);
      const [copiedId, setCopiedId] = useState(null);
      const [activeTone, setActiveTone] = useState("impact");

      const chatEndRef = useRef(null);
      const inputRef = useRef(null);

      const weakBullets = useMemo(() => {
        if (!activeData || !activeData.bullets) return [];
        return activeData.bullets.filter(b => b.is_weak);
      }, [activeData]);

      const weakCount = weakBullets.length;

      // Auto-scroll on new messages
      useEffect(() => {
        if (isOpen && !isMinimized) {
          chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
        }
      }, [messages, isTyping, isOpen, isMinimized]);

      // Handle Escape key to close popup
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === "Escape" && isOpen) {
            setIsOpen(false);
          }
        };
        window.addEventListener("keydown", handleKeyDown);
        return () => window.removeEventListener("keydown", handleKeyDown);
      }, [isOpen]);

      // Respond to external triggers (floating launcher or scorecard cards)
      useEffect(() => {
        if (!externalTrigger) return;
        setIsOpen(true);
        setIsMinimized(false);

        if (externalTrigger.bulletIndex != null && activeData?.bullets?.[externalTrigger.bulletIndex]) {
          const targetBullet = activeData.bullets[externalTrigger.bulletIndex];
          setActiveBulletIdx(externalTrigger.bulletIndex);
          startBulletFlow(targetBullet, externalTrigger.bulletIndex, true);
        } else {
          startInitialGreeting();
        }
      }, [externalTrigger]);

      // Helper to push bot message with simulated ~600ms typing indicator
      const pushBotMessage = useCallback((msg, delay = 600) => {
        setIsTyping(true);
        setTimeout(() => {
          setIsTyping(false);
          setMessages(prev => [...prev, { id: "m-" + Date.now() + "-" + Math.random().toString(36).substr(2, 4), role: "bot", ...msg }]);
        }, delay);
      }, []);

      const startInitialGreeting = () => {
        setMessages([
          {
            id: "msg-welcome",
            role: "bot",
            type: "text",
            payload: {
              text: `👋 Hi! I'm your AI CV Coach. I scanned your CV and found ${weakCount} weak bullets that could hurt your ATS ranking and interview callbacks. Let's upgrade them into high-impact accomplishments!`
            }
          },
          {
            id: "msg-menu",
            role: "bot",
            type: "text",
            payload: {
              text: "How would you like to start?",
              chips: [
                { label: "✨ Fix one by one", action: "start_one_by_one" },
                { label: "⚡ Rewrite all weak bullets", action: "start_rewrite_all" },
                { label: "🎯 Target Role keywords", action: "start_jd" }
              ]
            }
          }
        ]);
      };

      const startBulletFlow = (bullet, index, direct = false) => {
        const total = weakBullets.length || (activeData?.bullets?.length || 1);
        const weakPos = weakBullets.findIndex(b => b.id === bullet.id || b.text === bullet.text);
        const displayIdx = weakPos !== -1 ? weakPos + 1 : index + 1;

        const welcomeText = direct
          ? `Here is the bullet you selected to improve:`
          : `Let's tackle weak bullet ${displayIdx} of ${total}:`;

        setMessages(prev => [
          ...prev,
          {
            id: "m-bstart-" + Date.now(),
            role: "bot",
            type: "text",
            payload: { text: welcomeText }
          },
          {
            id: "m-bcard-" + Date.now(),
            role: "bot",
            type: "bullet_card",
            payload: {
              bullet: bullet,
              index: displayIdx,
              total: total
            }
          },
          {
            id: "m-tone-" + Date.now(),
            role: "bot",
            type: "tone_chips",
            payload: {
              prompt: "Select target rewriting tone:",
              bullet: bullet
            }
          }
        ]);
      };

      const handleToneSelect = async (toneKey, bullet) => {
        setActiveTone(toneKey);
        setMessages(prev => [
          ...prev,
          {
            id: "m-u-" + Date.now(),
            role: "user",
            type: "text",
            payload: { text: `Target Tone: ${toneKey.toUpperCase()}` }
          }
        ]);

        setIsTyping(true);
        try {
          const result = await apiService.rewriteBullet({
            bullet: bullet.text,
            role: activeData?.role || "Software Developer",
            jd_keywords: activeData?.skillsDetected || [],
            tone: toneKey
          });

          setIsTyping(false);
          setMessages(prev => [
            ...prev,
            {
              id: "m-rewrites-" + Date.now(),
              role: "bot",
              type: "rewrite_options",
              payload: {
                original: bullet,
                rewrites: result.rewrites,
                why_weak: result.why_weak,
                impact_score_before: result.impact_score_before,
                tone: toneKey
              }
            }
          ]);
        } catch (err) {
          setIsTyping(false);
          setMessages(prev => [
            ...prev,
            {
              id: "m-err-" + Date.now(),
              role: "bot",
              type: "error",
              payload: { text: "Unable to rewrite bullet right now. Please retry." }
            }
          ]);
        }
      };

      const handleUseRewrite = async (rewrittenText, originalBullet) => {
        setMessages(prev => [
          ...prev,
          {
            id: "m-user-pick-" + Date.now(),
            role: "user",
            type: "text",
            payload: { text: `Use this: "${rewrittenText}"` }
          }
        ]);

        setIsTyping(true);
        const { oldScore, newScore } = await onAcceptRewrite(rewrittenText, originalBullet);
        setIsTyping(false);

        const remainingWeak = (activeData?.bullets || []).filter(b => b.is_weak && b.id !== originalBullet.id && b.text !== rewrittenText);
        const nextBullet = remainingWeak[0];

        setMessages(prev => [
          ...prev,
          {
            id: "m-scoreup-" + Date.now(),
            role: "bot",
            type: "score_update",
            payload: {
              oldScore,
              newScore,
              diff: Math.max(1, newScore - oldScore),
              hasNext: !!nextBullet,
              nextBullet: nextBullet
            }
          }
        ]);
      };

      const handleCopy = (text, id) => {
        navigator.clipboard.writeText(text);
        setCopiedId(id);
        setTimeout(() => setCopiedId(null), 1800);
      };

      const handleChipAction = (action, payload) => {
        if (action === "start_one_by_one") {
          const firstWeak = weakBullets[0] || activeData?.bullets?.[0];
          if (firstWeak) {
            startBulletFlow(firstWeak, 0);
          } else {
            pushBotMessage({
              type: "text",
              payload: { text: "🎉 Great job! No weak bullets were found in your CV. All points have strong action verbs and quantified impact!" }
            });
          }
        } else if (action === "start_rewrite_all") {
          handleRewriteAll();
        } else if (action === "start_jd") {
          pushBotMessage({
            type: "text",
            payload: {
              text: `Target role is set to: "${activeData?.role || 'Software Developer'}". We are also factoring in your detected skills: ${(activeData?.skillsDetected || []).slice(0, 5).join(', ')}. Click "Fix one by one" to apply them!`,
              chips: [{ label: "✨ Start Fixing Bullets", action: "start_one_by_one" }]
            }
          });
        } else if (action === "next_bullet") {
          if (payload?.nextBullet) {
            startBulletFlow(payload.nextBullet, 0);
          } else {
            const nextWeak = weakBullets[0];
            if (nextWeak) {
              startBulletFlow(nextWeak, 0);
            } else {
              pushBotMessage({
                type: "text",
                payload: { text: "🎉 Excellent! You have strengthened all identified weak bullets in your CV. Your score and callback readiness are maximized!" }
              });
            }
          }
        } else if (action === "skip_bullet") {
          pushBotMessage({
            type: "text",
            payload: {
              text: "Skipped bullet. What would you like to do next?",
              chips: [
                { label: "➡️ Next Weak Bullet", action: "next_bullet" },
                { label: "⚡ Rewrite All", action: "start_rewrite_all" }
              ]
            }
          });
        }
      };

      const handleRewriteAll = async () => {
        if (!weakBullets.length) {
          pushBotMessage({
            type: "text",
            payload: { text: "No weak bullets detected to rewrite!" }
          });
          return;
        }

        setMessages(prev => [
          ...prev,
          {
            id: "m-u-batch-" + Date.now(),
            role: "user",
            type: "text",
            payload: { text: "Rewrite all weak bullets concurrently ⚡" }
          },
          {
            id: "m-progress-" + Date.now(),
            role: "bot",
            type: "progress",
            payload: { text: `Concurrently rewriting ${weakBullets.length} weak bullets with high-impact action verbs...` }
          }
        ]);

        try {
          const res = await apiService.rewriteAllBullets({
            bullets: weakBullets,
            role: activeData?.role || "Software Developer",
            jd_keywords: activeData?.skillsDetected || [],
            tone: activeTone
          });

          pushBotMessage({
            type: "text",
            payload: {
              text: `⚡ Concurrency complete! Rewrote ${res.results.length} bullets. Let's review the first one:`,
              chips: [{ label: "Review First Bullet →", action: "start_one_by_one" }]
            }
          });
        } catch (err) {
          pushBotMessage({
            type: "error",
            payload: { text: "Batch rewrite encountered an issue. Try one by one." }
          });
        }
      };

      const handleSendFreeText = async (e) => {
        e.preventDefault();
        const text = inputVal.trim();
        if (!text) return;
        setInputVal("");

        setMessages(prev => [
          ...prev,
          { id: "m-u-" + Date.now(), role: "user", type: "text", payload: { text } }

        const norm = text.toLowerCase();
        if (norm === "shorter" || norm === "concise") {

          const currentBullet = weakBullets[0] || activeData?.bullets?.[0];

          return;

        if (norm === "more technical" || norm === "technical") {
          pushBotMessage({ type: "text", payload: { text: "Switching to Technical mode with deep systems architecture phrasing..." } });
          const currentBullet = weakBullets[0] || activeData?.bullets?.[0];
          if (currentBullet) handleToneSelect("technical", currentBullet);
          return;

        if (norm === "leadership") {

        if (text.split(" ").length >= 4) {
          setIsTyping(true);
          const customBulletObj = { id: "custom-" + Date.now(), text, section: "Custom Input", is_weak: true };
          try {
            const res = await apiService.rewriteBullet({
              bullet: text,
              role: activeData?.role || "Software Developer",

            setMessages(prev => [

        pushBotMessage({
          type: "text",

              { label: "✨ Fix one by one", action: "start_one_by_one" },

                      }`}

    function App() {
      const [isDark, setIsDark] = useState(true);
      const scrollY = useScrollPosition();
      const [currentView, setCurrentView] = useState("welcome"); // 'welcome' | 'dashboard'
      const [dashboardTab, setDashboardTab] = useState("scorecard"); // 'input' | 'scorecard' | 'skills' | 'model'
      const [activePresetKey, setActivePresetKey] = useState("senior");
      useScrollReveal([currentView, dashboardTab, activePresetKey]);
      const [modelType, setModelType] = useState("dual");
      const [isEvaluating, setIsEvaluating] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [customData, setCustomData] = useState(null);
      const [uploadedFile, setUploadedFile] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const [showPasteText, setShowPasteText] = useState(false);
      const [pastedText, setPastedText] = useState("");

      const activeData = useMemo(() => customData || PRESETS[activePresetKey], [customData, activePresetKey]);

      const handlePresetChange = (key) => {
        setIsEvaluating(true);
        setCustomData(null);
        setUploadedFile(null);
        setPastedText("");
        setShowPasteText(false);
        setTimeout(() => {
          setActivePresetKey(key);
          setIsEvaluating(false);
          setDashboardTab("scorecard");
        }, 320);
      };

      const handleFileSelect = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadedFile(file);
        await uploadAndEvaluate(file);
      };

      const uploadAndEvaluate = async (file) => {
        setIsEvaluating(true);
        try {
          const formData = new FormData();
          formData.append("file", file);
          formData.append("model", modelType);
          const resp = await fetch("/api/analyze", { method: "POST", body: formData });
          if (resp.ok) {
            const data = await resp.json();
            setCustomData(data);
            setDashboardTab("scorecard");
          } else {
            console.warn("API response error, falling back to preset");
          }
        } catch (err) {
          console.warn("Live backend unreachable, using preset preview", err);
        } finally {
          setIsEvaluating(false);
        }
      };

      const handlePasteEvaluate = async () => {
        if (!pastedText.trim()) return;
        setIsEvaluating(true);
        try {
          const resp = await fetch("/api/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text: pastedText,
              fileName: "Pasted_Resume.txt",
              model: modelType
            })
          });
          if (resp.ok) {
            const data = await resp.json();
            setCustomData(data);
            setDashboardTab("scorecard");
          }
        } catch (err) {
          console.warn("Live backend unreachable", err);
        } finally {
          setIsEvaluating(false);
        }
      };

      const handleRunEval = async () => {
        if (uploadedFile) {
          await uploadAndEvaluate(uploadedFile);
        } else if (pastedText.trim()) {
          await handlePasteEvaluate();
        } else {
          setIsEvaluating(true);
          setTimeout(() => {
            setIsEvaluating(false);
            setDashboardTab("scorecard");
          }, 600);
        }
      };

      const handleExportJSON = () => {
        const jsonStr = JSON.stringify(activeData, null, 2);
        const blob = new Blob([jsonStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        const safeRole = (activeData.role || "Report").replace(/[^a-zA-Z0-9]/g, "_");
        a.download = `CVision_Diagnostic_${safeRole}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      // -------------------------------------------------------------
      // AI Coach Triggers & Bullet Acceptance Handlers
      // -------------------------------------------------------------
      const [coachTrigger, setCoachTrigger] = useState(null);

      const handleOpenCoach = (bulletIndex = null) => {
        setCoachTrigger({ bulletIndex, timestamp: Date.now() });
      };

      const handleAcceptRewrite = async (rewrittenText, originalBullet) => {
        const oldScore = activeData.score;
        const currentBullets = [...(activeData.bullets || [])];
        const targetIdx = currentBullets.findIndex(b => b.id === originalBullet.id || b.text === originalBullet.text);

        if (targetIdx !== -1) {
          currentBullets[targetIdx] = {
            ...currentBullets[targetIdx],
            text: rewrittenText,
            is_weak: false,
            why_weak: "Optimized for maximum quantified impact.",
            impact_score_before: 9
          };
        }

        const oldRawText = activeData.rawText || "";
        const updatedRawText = oldRawText.includes(originalBullet.text)
          ? oldRawText.replace(originalBullet.text, rewrittenText)
          : `${oldRawText}\n• ${rewrittenText}`;

        const remainingWeak = currentBullets.filter(b => b.is_weak).length;
        const newScore = Math.min(100, oldScore + 4);

        const updatedData = {
          ...activeData,
          bullets: currentBullets,
          weakBulletsCount: remainingWeak,
          score: newScore,
          rawText: updatedRawText
        };

        setCustomData(updatedData);

        try {
          const resp = await fetch("/api/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: updatedRawText, model: modelType })
          });
          if (resp.ok) {
            const serverData = await resp.json();
            setCustomData({
              ...serverData,
              bullets: currentBullets,
              weakBulletsCount: remainingWeak
            });
            return { oldScore, newScore: serverData.score };
          }
        } catch (err) {
          console.log("Offline re-score fallback applied");
        }

        return { oldScore, newScore };
      };

                    <span className={`text-[10px] uppercase font-mono px-2 py-0.5 rounded-full font-bold border ${
                      isDark 
                        ? 'bg-cyan-500/10 border-cyan-400/30 text-cyan-300' 
                        : 'bg-indigo-100 border-indigo-200 text-indigo-700'
                    }`}>v2.4</span>
                  </div>
                  <span className={`text-[11px] font-medium tracking-wide -mt-0.5 ${isDark ? 'text-slate-400' : 'text-slate-500'}`}>Resume Intelligence Engine</span>
                </div>
              </div>

              <div className="flex items-center gap-3.5">
                <div className={`hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full border backdrop-blur-xl shadow-sm text-xs font-medium ${

                    : 'bg-white/60 border-white/80 text-slate-600'
                }`}>
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>

                      <path strokeLinecap="round" strokeLinejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />

                    </svg>

                    : 'bg-white/65 border-white/80 shadow-[0_20px_50px_rgba(15,23,42,0.1),0_1px_0_rgba(255,255,255,0.9)_inset]'

                          className={`text-xs font-semibold hover:underline flex items-center gap-1 ${
                            isDark ? 'text-cyan-300' : 'text-blue-900'

                      </div>
                    </div>
                  </div>

                  {/* 4 Dimension Cards */}

                    isDark ? 'bg-[#08252C] border-cyan-800/40 shadow-xl' : 'bg-white border-sky-200 shadow-md'

                      <h3 className="text-base font-extrabold tracking-tight">Transparent 4-Factor Heuristic Breakdown</h3>
                      <p className={`text-xs mt-0.5 ${isDark ? 'text-cyan-200/60' : 'text-slate-500'}`}>
                        Scoring matrix based on quantifiable structural and linguistic deliverables
                      </p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 cv-stagger">
                      {activeData.breakdown.map((item, idx) => (
                        <div key={idx} className={`p-4 rounded-xl border cv-reveal ${
                          isDark ? 'bg-[#0B3039]/50 border-cyan-900/30' : 'bg-sky-50/60 border-sky-100'
                        }`}>
                          <div className="flex items-center justify-between">
                            <span className="text-xs font-bold">{item.title}</span>
                            <span className="text-xs font-mono font-bold">
                              {item.score} <span className={isDark ? 'text-cyan-300/50' : 'text-slate-400'}>/ {item.max} pts</span>
                            </span>
                          </div>
                          <div className={`w-full h-2 rounded-full overflow-hidden mt-3 ${isDark ? 'bg-[#05161A]' : 'bg-sky-200/60'}`}>
                            <div
                              className={`h-full rounded-full ${isDark ? 'bg-cyan-400' : 'bg-blue-600'}`}
                              style={{ width: `${(item.score / item.max) * 100}%` }}
                            ></div>
                          </div>
                          <p className={`text-[11px] mt-2 ${isDark ? 'text-cyan-200/60' : 'text-slate-500'}`}>
                            {item.desc}
                          </p>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Diagnostic Feedback */}
                  <div className={`p-6 rounded-2xl border space-y-3.5 cv-reveal ${
                    isDark ? 'bg-[#08252C] border-cyan-800/40 shadow-xl' : 'bg-white border-sky-200 shadow-md'
                  }`}>
                    <h4 className="text-xs font-bold uppercase tracking-wider font-mono">Actionable Diagnostic Feedback</h4>
                    <div className="space-y-2.5 text-xs">
                      {activeData.strengths.map((str, i) => (
                        <div key={i} className="flex items-start gap-2.5 text-emerald-600 dark:text-emerald-400">
                          <span>✅</span>
                          <span className="font-medium text-slate-700 dark:text-slate-200"><strong className="font-bold">Strength:</strong> {str}</span>
                        </div>
                      ))}
                      {activeData.improvements.map((imp, i) => (
                        <div key={i} className="flex items-start gap-2.5 text-amber-600 dark:text-amber-400">
                          <span>⚠️</span>
                          <span className="font-medium text-slate-700 dark:text-slate-200"><strong className="font-bold">Improvement:</strong> {imp}</span>
                        </div>
                      ))}
                      <div className="flex items-start gap-2.5 text-cyan-600 dark:text-cyan-300">
                        <span>💡</span>
                        <span className="font-medium text-slate-700 dark:text-slate-200"><strong className="font-bold">Action Item:</strong> {activeData.actionItem}</span>
                      </div>
                    </div>

                    <div className="pt-4 border-t border-cyan-900/30 flex flex-wrap items-center justify-between gap-3 text-xs">
                      <button
                        onClick={() => setDashboardTab("skills")}
                        className={`font-semibold hover:underline flex items-center gap-1.5 ${isDark ? 'text-cyan-300' : 'text-blue-900'}`}
                      >
                        <span>🎯</span>
                        <span>Open Skill Gap Matrix →</span>
                      </button>
                      <button
                        onClick={() => setDashboardTab("model")}
                        className={`font-semibold hover:underline flex items-center gap-1.5 ${isDark ? 'text-cyan-300' : 'text-blue-900'}`}
                      >
                        <span>🧠</span>
                        <span>Inspect Neural Network Weights &amp; Distribution →</span>
                      </button>
                    </div>
                  </div>

                  {/* Entry Point 2: AI Coach Banner Card */}
                  <div className={`p-5 rounded-2xl border flex flex-col md:flex-row md:items-center justify-between gap-4 transition-all relative overflow-hidden cv-reveal ${
                    isDark 
                      ? 'bg-gradient-to-r from-[#08252C] via-[#0B3039] to-[#08252C] border-cyan-500/40 shadow-[0_0_25px_rgba(0,240,255,0.12)]' 
                      : 'bg-gradient-to-r from-sky-50 via-cyan-50 to-sky-50 border-cyan-300 shadow-md'
                  }`}>
                    <div className="flex items-start sm:items-center gap-3.5">
                      <div className="w-11 h-11 rounded-2xl bg-cyan-500/20 text-cyan-300 border border-cyan-400/30 flex items-center justify-center text-xl shrink-0 shadow-inner">
                        ✨
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <h4 className="text-sm font-bold font-mono text-cyan-300 tracking-wide uppercase">AI Bullet Coach</h4>
                          <span className="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                            {activeData.weakBulletsCount || (activeData.bullets ? activeData.bullets.filter(b => b.is_weak).length : 0)} Bullets Can Be Improved
                          </span>
                        </div>
                        <p className={`text-xs mt-0.5 ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                          Upgrade passive duties into quantified accomplishment statements with real-time CV re-scoring.
                        </p>
                      </div>
                    </div>
                    <button
                      onClick={() => handleOpenCoach()}
                      className="px-5 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-cyan-400 to-teal-400 text-[#05161A] hover:brightness-110 active:scale-95 transition-all shadow-lg flex items-center justify-center gap-2 shrink-0"
                    >
                      <span>💬</span>
                      <span>Chat with CV Coach →</span>
                    </button>
                  </div>

                  {/* Entry Point 3: Experience & Project Bullets List with "✨ Improve" Buttons */}
                  {activeData.bullets && activeData.bullets.length > 0 && (
                    <div className={`p-6 rounded-2xl border space-y-4 cv-reveal ${
                      isDark ? 'bg-[#08252C] border-cyan-800/40 shadow-xl' : 'bg-white border-sky-200 shadow-md'
                    }`}>
                      <div className="flex items-center justify-between border-b pb-3 border-cyan-900/30">
                        <div>
                          <h4 className="text-xs font-bold uppercase tracking-wider font-mono flex items-center gap-2">
                            <span>📝</span>
                            <span>Experience &amp; Project Bullets Analysis</span>
                          </h4>
                          <p className={`text-[11px] mt-0.5 ${isDark ? 'text-cyan-200/60' : 'text-slate-500'}`}>
                            Review detected bullet points from your CV. Click "✨ Improve" to launch targeted AI rewrites.
                          </p>
                        </div>
                        <span className={`text-xs font-mono font-bold px-2.5 py-1 rounded-lg ${
                          (activeData.weakBulletsCount || 0) > 0 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'
                        }`}>
                          {(activeData.weakBulletsCount || 0)} weak / {activeData.bullets.length} total
                        </span>
                      </div>

                      <div className="space-y-3">
                        {activeData.bullets.map((bullet, idx) => (
                          <div
                            key={bullet.id || idx}
                            className={`p-3.5 rounded-xl border text-xs transition-all flex flex-col md:flex-row md:items-center justify-between gap-3 ${
                              bullet.is_weak
                                ? isDark ? 'bg-rose-950/20 border-rose-800/40' : 'bg-rose-50/70 border-rose-200'
                                : isDark ? 'bg-emerald-950/20 border-emerald-800/30' : 'bg-emerald-50/70 border-emerald-200'
                            }`}
                          >
                            <div className="space-y-1.5 flex-1">
                              <div className="flex items-center gap-2">
                                <span className={`text-[10px] font-mono uppercase px-1.5 py-0.5 rounded font-bold ${
                                  bullet.section === 'Projects' ? 'bg-purple-500/20 text-purple-300' : 'bg-cyan-500/20 text-cyan-300'
                                }`}>
                                  {bullet.section || 'Experience'}
                                </span>
                                <span className={`text-[10px] font-extrabold ${bullet.is_weak ? 'text-rose-400' : 'text-emerald-400'}`}>
                                  {bullet.is_weak ? `⚠️ Weak (${bullet.impact_score_before || 4}/10)` : '✅ High Impact (9/10)'}
                                </span>
                                {bullet.is_weak && bullet.why_weak && (
                                  <span className="text-[10px] text-slate-400 truncate max-w-xs">• {bullet.why_weak}</span>
                                )}
                              </div>
                              <p className={`leading-relaxed ${isDark ? 'text-slate-200' : 'text-slate-800'}`}>
                                {bullet.text}
                              </p>
                            </div>

                            <div className="shrink-0 flex items-center gap-2 self-end md:self-center">
                              {bullet.is_weak ? (
                                <button
                                  onClick={() => handleOpenCoach(idx)}
                                  className="px-3 py-1.5 rounded-lg text-xs font-bold bg-cyan-400 hover:bg-cyan-300 text-[#05161A] transition-all flex items-center gap-1 shadow-sm active:scale-95"
                                >
                                  <span>✨</span>
                                  <span>Improve</span>
                                </button>
                              ) : (
                                <button
                                  onClick={() => handleOpenCoach(idx)}
                                  className={`px-3 py-1.5 rounded-lg text-xs font-medium border hover:border-cyan-400 transition-all flex items-center gap-1 ${
                                    isDark ? 'border-cyan-900/60 text-cyan-300' : 'border-slate-300 text-slate-700'
                                  }`}
                                >
                                  <span>✨</span>
                                  <span>Refine</span>
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* VIEW 3: Skill Gap Matrix */}
              {dashboardTab === "skills" && (
                <div className="animate-page space-y-6">
                  <div className={`p-6 rounded-2xl border cv-reveal ${
                    isDark ? 'bg-[#08252C] border-cyan-800/40 shadow-xl' : 'bg-white border-sky-200 shadow-md'
                  }`}>
                    <div className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b pb-4 border-cyan-900/30">
                      <div>
                        <h3 className="text-lg font-extrabold tracking-tight">Skill Gap Matrix (Demand vs. Supply)</h3>
                        <p className={`text-xs mt-1 ${isDark ? 'text-cyan-200/60' : 'text-slate-500'}`}>
                          Extracted skill taxonomy matched against top 25 industry requirements for <strong className="font-bold text-slate-200 dark:text-cyan-200">{activeData.role}</strong>
                        </p>
                      </div>
                      <div className={`text-xs font-mono px-3 py-1.5 rounded-xl border font-bold shrink-0 ${
                        isDark ? 'bg-cyan-500/10 text-cyan-300 border-cyan-500/30' : 'bg-sky-100 text-sky-800 border-sky-200'
                      }`}>
                        {activeData.skillsFound} / {activeData.totalSkills} Skills Found
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      {/* Skills Found */}
                      <div className={`p-5 rounded-2xl border ${
                        isDark ? 'bg-[#0B3039]/50 border-cyan-900/30' : 'bg-sky-50/60 border-sky-100'
                      }`}>
                        <div className="flex items-center justify-between mb-4">
                          <span className="text-xs font-bold uppercase tracking-wider font-mono flex items-center gap-2 text-emerald-500 dark:text-emerald-400">
                            <span className="text-sm">✓</span> Detected in Resume ({activeData.skillsDetected.length})
                          </span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {activeData.skillsDetected.map((skill, i) => (
                            <span
                              key={i}
                              className={`text-xs font-mono px-3 py-1.5 rounded-xl border font-semibold ${
                                isDark
                                  ? 'bg-emerald-950/40 text-emerald-300 border-emerald-500/30'
                                  : 'bg-emerald-50 text-emerald-800 border-emerald-200'
                              }`}
                            >
                              {skill}
                            </span>
                          ))}
                        </div>
                      </div>

                      {/* Missing Recommended Skills */}
                      <div className={`p-5 rounded-2xl border ${
                        isDark ? 'bg-[#0B3039]/50 border-cyan-900/30' : 'bg-sky-50/60 border-sky-100'
                      }`}>
                        <div className="flex items-center justify-between mb-4">
                          <span className="text-xs font-bold uppercase tracking-wider font-mono flex items-center gap-2 text-amber-500 dark:text-amber-400">
                            <span className="text-sm">+</span> Recommended In-Demand Skills ({activeData.skillsMissing.length})
                          </span>
                        </div>
                        <div className="flex flex-wrap gap-2">
                          {activeData.skillsMissing.map((skill, i) => (
                            <span
                              key={i}
                              className={`text-xs font-mono px-3 py-1.5 rounded-xl border font-semibold ${
                                isDark
                                  ? 'bg-amber-950/40 text-amber-300 border-amber-500/30'
                                  : 'bg-amber-50 text-amber-800 border-amber-200'
                              }`}
                            >
                              + {skill}
                            </span>
                          ))}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* VIEW 4: AI Model Lab */}
              {dashboardTab === "model" && (
                <div className="animate-page space-y-6">
                  <div className={`p-6 rounded-2xl border cv-reveal ${
                    isDark ? 'bg-[#08252C] border-cyan-800/40 shadow-xl' : 'bg-white border-sky-200 shadow-md'
                  }`}>
                    {/* Top-5 Distribution */}
                    <div className="space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b pb-4 border-cyan-900/30">
                        <div>
                          <h3 className="text-lg font-extrabold tracking-tight">Top-5 Predicted Occupational Classes</h3>
                          <p className={`text-xs mt-1 ${isDark ? 'text-cyan-200/60' : 'text-slate-500'}`}>
                            Softmax probability distribution output from the classification head across 24 classes
                          </p>
                        </div>
                        <span className={`text-[11px] font-mono px-3 py-1.5 rounded-full font-bold uppercase tracking-wider shrink-0 ${
                          isDark ? 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/30' : 'bg-sky-100 text-sky-800 border border-sky-200'
                        }`}>
                          PyTorch Dual-Branch
                        </span>
                      </div>

                      {/* Bars */}
                      <div className="space-y-4">
                        {activeData.topRoles.map((role, idx) => (
                          <div key={idx} className="space-y-1.5">
                            <div className="flex items-center justify-between text-xs font-mono">
                              <div className="flex items-center gap-2">
                                <span className={isDark ? 'text-cyan-400 font-bold' : 'text-slate-500'}>{idx + 1}.</span>
                                <span className={`font-semibold ${role.isTop ? (isDark ? 'text-cyan-300 font-bold' : 'text-blue-900 font-bold') : ''}`}>
                                  {role.name}
                                </span>
                                {role.isTop && (
                                  <span className={`text-[9px] uppercase font-bold px-1.5 py-0.5 rounded ${
                                    isDark ? 'bg-cyan-400 text-[#05161A]' : 'bg-blue-900 text-white'
                                  }`}>
                                    TOP MATCH
                                  </span>
                                )}
                              </div>
                              <span className="font-bold">{role.prob}%</span>
                            </div>
                            <div className={`w-full h-3 rounded-full overflow-hidden ${isDark ? 'bg-[#05161A]' : 'bg-sky-100'}`}>
                              <div
                                className={`h-full rounded-full transition-all duration-700 ${
                                  role.isTop
                                    ? isDark ? 'bg-gradient-to-r from-cyan-400 to-teal-300' : 'bg-blue-600'
                                    : isDark ? 'bg-[#0B3039]' : 'bg-slate-300'
                                }`}
                                style={{ width: `${role.prob}%` }}
                              ></div>
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* Attribution Callout */}
                      <div className={`p-5 rounded-2xl border flex items-start gap-3.5 ${
                        isDark 
                          ? 'bg-[#05161A]/80 border-cyan-500/30 text-cyan-100' 
                          : 'bg-sky-50 border-sky-200 text-slate-800'
                      }`}>
                        <div className="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 bg-amber-400/20 text-amber-500 font-bold text-base">
                          💡
                        </div>
                        <div>
                          <h4 className="text-xs font-bold uppercase tracking-wider font-mono text-amber-500 dark:text-amber-400">
                            Explainability Attribution: Why This Category?
                          </h4>
                          <p className="text-xs mt-1.5 leading-relaxed">
                            {activeData.attribution}
                          </p>
                        </div>
                      </div>

                      {/* Linguistic Stats */}
                      <div className="pt-2">
                        <h4 className="text-xs font-bold uppercase tracking-wider font-mono mb-3">Extracted Linguistic Vector Dimensions</h4>
                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                          {[
                            { label: "Word Count", val: activeData.stats.words },
                            { label: "Sentences", val: activeData.stats.sentences },
                            { label: "Numbers Detected", val: activeData.stats.numbers },
                            { label: "Action Verbs", val: activeData.stats.verbs },
                            { label: "Readability Level", val: activeData.stats.readability }
                          ].map((s, idx) => (
                            <div key={idx} className={`p-3.5 rounded-xl border text-center ${
                              isDark ? 'bg-[#0B3039]/50 border-cyan-900/30' : 'bg-sky-50 border-sky-100'
                            }`}>
                              <span className={`text-[10px] font-mono uppercase block ${isDark ? 'text-cyan-300/60' : 'text-slate-500'}`}>
                                {s.label}
                              </span>
                              <span className="text-lg font-black font-mono mt-1 block">
                                {s.val}
                              </span>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* OCR Buffer */}
                      <div className="space-y-2 pt-2">
                        <span className="text-xs font-mono uppercase font-bold tracking-wider">Sanitized OCR Buffer</span>
                        <pre className={`p-4 rounded-xl border text-xs font-mono max-h-48 overflow-y-auto leading-relaxed ${
                          isDark 
                            ? 'bg-[#05161A] border-cyan-900/30 text-cyan-200/80' 
                            : 'bg-slate-50 border-slate-200 text-slate-700'
                        }`}>
{activeData.rawText 
  ? `[DOCUMENT]: ${activeData.fileName} (${activeData.fileSize})
[PREDICTED CATEGORY]: ${activeData.role} (${activeData.confidence})

--- EXTRACTED RESUME TEXT ---
${activeData.rawText}`
  : `[PARSED HEADER]: ${activeData.name} | Role: ${activeData.role}
[SECTIONS DETECTED]: Summary (present), Work Experience, Education, Skills, Projects.
[SAMPLE EXTRACT]: Led architecture and deployment of high-throughput services handling 45k req/sec with 99.98% uptime SLA. Built CI/CD pipelines using Docker and Kubernetes.`}
                        </pre>
                      </div>

                      {/* Footer Actions */}
                      <div className="pt-4 border-t border-cyan-900/30 flex flex-wrap items-center justify-between gap-3 text-xs">
                        <button
                          onClick={handleExportJSON}
                          className={`px-4 py-2 rounded-xl font-bold font-mono transition border ${
                            isDark 
                              ? 'bg-cyan-500/10 text-cyan-300 border-cyan-500/30 hover:bg-cyan-500/20' 
                              : 'bg-sky-100 text-sky-900 border-sky-300 hover:bg-sky-200'
                          }`}
                        >
                          Export Diagnostic JSON
                        </button>
                        <button
                          onClick={() => setShowReportModal(true)}
                          className={`px-4 py-2 rounded-xl font-bold transition active:scale-95 ${
                            isDark ? 'bg-cyan-400 text-[#05161A]' : 'bg-slate-900 text-white'
                          }`}
                        >
                          View Viva Spec
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
          {/* Technical Report Modal */}
          {showReportModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`w-full max-w-xl rounded-2xl border p-6 shadow-2xl space-y-4 ${
                isDark ? 'bg-[#08252C] border-cyan-500/40 text-white' : 'bg-white border-sky-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between border-b pb-3 border-cyan-900/30">
                  <h3 className="font-extrabold text-lg flex items-center gap-2">
                    <span>📑</span> Technical Report & Model Architecture
                  </h3>
                  <button 
                    onClick={() => setShowReportModal(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>
                <div className="text-xs space-y-3 leading-relaxed">
                  <p className={`font-bold text-sm ${isDark ? 'text-cyan-300' : 'text-sky-900'}`}>CVision: Explainable AI CV Evaluator</p>
                  <p><strong>Model Weights:</strong> Dual-Branch PyTorch network combining 5,000-dim TF-IDF text representations (256-dim latent) with 13 hand-engineered structural features (32-dim latent) into a 128-dim fusion head (1,321,624 parameters).</p>
                  <p><strong>Scoring Algorithm:</strong> 0–100 composite index based on Quantified Impact (30%), Section Completeness (30%), Action Verb Density (20%), and Lexical Diversity (20%).</p>
                  <div className="pt-2 border-t border-cyan-900/30">
                    <p><strong>Developed by:</strong></p>
                    <p>M. Shehryar Waheed</p>
                    <p>Aqsa Ehtesham</p>
                  </div>
                </div>
                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setShowReportModal(false)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold ${
                      isDark ? 'bg-cyan-400 text-[#05161A]' : 'bg-slate-900 text-white'
                    }`}
                  >
                    Close Report
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* AI Bullet Rewriter / CV Coach Widget (Portal mounted, removable with this single line) */}
          <CVCoachWidget
            isDark={isDark}
            activeData={activeData}
            onAcceptRewrite={handleAcceptRewrite}
            externalTrigger={coachTrigger}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
