<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CVision — Animated AI Resume Intelligence Engine</title>

  <!-- Google Fonts: Plus Jakarta Sans, Playfair Display & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React 18 & Babel UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background: #130306;
      color: #fff2f2;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ==========================================================================
       DESIGN TOKENS & DYNAMIC THEMES (Mariana Studio Luxury Dark & Crisp Light)
       ========================================================================== */
    .r {
      --bg: #130306;
      --bg2: #3a0a12;
      --card: rgba(80, 14, 22, 0.65);
      --pn: rgba(80, 14, 22, 0.6);
      --bd: rgba(255, 140, 150, 0.26);
      --tx: #fff2f2;
      --mu: #e2bcc0;
      --c: #22d3ee;
      --g: #4ade80;
      --am: #fbbf24;
      --rd: #fb7185;
      --code: #04181d;
      --o1: rgba(34, 211, 238, 0.22);
      --o2: rgba(248, 113, 113, 0.3);
      --btn: #031a20;
      position: relative;
      min-height: 100vh;
      color: var(--tx);
      background: var(--bg);
      font-size: 17px;
      line-height: 1.5;
      transition: background 0.6s ease, color 0.6s ease;
      overflow: hidden;
    }

    /* Light Theme override */
    .r.light,
    .r:has(#th:checked) {
      --bg: #eef8ff;
      --bg2: #d9f0ff;
      --card: rgba(255, 255, 255, 0.85);
      --pn: rgba(255, 255, 255, 0.85);
      --bd: rgba(8, 110, 150, 0.25);
      --tx: #0c2238;
      --mu: #3a566e;
      --c: #0e7490;
      --g: #047857;
      --am: #b45309;
      --rd: #be123c;
      --code: #e3f2fb;
      --o1: rgba(34, 211, 238, 0.35);
      --o2: rgba(251, 146, 60, 0.3);
      --btn: #ffffff;
    }

    /* Background Ambient Orbs */
    .o {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      animation: drift 16s ease-in-out infinite alternate;
    }
    .o1 {
      width: 460px;
      height: 460px;
      right: 5%;
      top: -80px;
      background: var(--o1);
    }
    .o2 {
      width: 420px;
      height: 420px;
      left: 20%;
      bottom: -100px;
      background: var(--o2);
      animation-direction: alternate-reverse;
    }
    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-80px, 70px); }
    }

    /* Aurora Glow Particles */
    .au {
      position: absolute;
      inset: -260px 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .au i {
      position: absolute;
      width: 70vw;
      height: 55vh;
      min-width: 560px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.55;
      mix-blend-mode: screen;
      animation: aur 18s ease-in-out infinite alternate;
    }
    .au i:nth-child(1) {
      left: -10%;
      top: 12%;
      background: linear-gradient(120deg, #22d3ee, #4ade80);
    }
    .au i:nth-child(2) {
      right: -15%;
      top: 28%;
      background: linear-gradient(120deg, #f43f5e, #a855f7);
      animation-duration: 23s;
      animation-delay: -6s;
    }
    .au i:nth-child(3) {
      left: 20%;
      top: 55%;
      background: linear-gradient(120deg, #6366f1, #22d3ee);
      animation-duration: 27s;
      animation-delay: -12s;
    }
    .au::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(100deg, transparent 0 6%, rgba(34, 211, 238, 0.14) 10%, transparent 16%);
      background-size: 200% 100%;
      animation: curt 22s linear infinite;
      -webkit-mask-image: linear-gradient(#000, transparent 85%);
      mask-image: linear-gradient(#000, transparent 85%);
    }
    .au b {
      position: absolute;
      bottom: 0;
      left: var(--x);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 14px 4px var(--c);
      opacity: 0;
      animation: flt 14s linear infinite;
      animation-delay: var(--dl);
    }
    .r.light .au i,
    .r:has(#th:checked) .au i {
      mix-blend-mode: normal;
      opacity: 0.4;
    }
    .r.light .au b,
    .r:has(#th:checked) .au b {
      background: var(--c);
    }
    @keyframes aur {
      from { transform: translate(0, 0) rotate(0) scale(1); }
      50% { transform: translate(8vw, 6vh) rotate(25deg) scale(1.2); }
      to { transform: translate(-6vw, 12vh) rotate(-15deg) scale(0.9); }
    }
    @keyframes curt {
      to { background-position: 200% 0; }
    }
    @keyframes flt {
      0% { transform: translateY(0); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-70vh); opacity: 0; }
    }

    /* Top Page Reading Progress Bar */
    .pb {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      z-index: 50;
      background: linear-gradient(90deg, #22d3ee, #4ade80, #f43f5e);
      transform-origin: left;
      transition: transform 0.15s ease-out;
    }

    /* Keyframe Animations */
    @keyframes rise {
      from { opacity: 0; transform: translateY(35px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slideR {
      from { opacity: 0; transform: translateX(60px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes slideL {
      from { opacity: 0; transform: translateX(-60px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes down {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes grow {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.6) rotate(-4deg); }
      to { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 var(--g); }
      80%, 100% { box-shadow: 0 0 0 10px transparent; }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    @keyframes pulseB {
      0%, 100% { border-color: var(--bd); }
      50% { border-color: var(--c); }
    }
    @keyframes sheen {
      from { background-position: 200% 0; }
      to { background-position: 0 0; }
    }
    @keyframes rot {
      to { transform: rotate(360deg); }
    }
    @keyframes slideSh {
      from { transform: translateX(-120%); }
      to { transform: translateX(320%); }
    }
    @keyframes type {
      from { max-width: 0; }
      to { max-width: 100%; }
    }
    @keyframes caret {
      50% { border-color: transparent; }
    }
    @property --a {
      syntax: '<angle>';
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes spin {
      to { --a: 360deg; }
    }

    
    
    /* Green Glassmorphic Action Buttons */
    .btn-glass-green {
      background: rgba(16, 185, 129, 0.18) !important;
      background-color: rgba(16, 185, 129, 0.18) !important;
      backdrop-filter: blur(12px) !important;
      -webkit-backdrop-filter: blur(12px) !important;
      border: 1px solid rgba(52, 211, 153, 0.55) !important;
      color: #34d399 !important;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25) !important;
      font-weight: 700 !important;
      border-radius: 99px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
      cursor: pointer !important;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .btn-glass-green:hover {
      background: rgba(16, 185, 129, 0.32) !important;
      background-color: rgba(16, 185, 129, 0.32) !important;
      border-color: rgba(52, 211, 153, 0.85) !important;
      color: #6ee7b7 !important;
      transform: translateY(-1.5px) !important;
      box-shadow: 0 6px 22px rgba(16, 185, 129, 0.45) !important;
    }
    .btn-glass-green:active {
      transform: scale(0.96) !important;
    }

    /* Chatbot Close Button: Red background, Black cross icon */
    .coach-close-btn {
      background: #ef4444 !important;
      background-color: #ef4444 !important;
      color: #000000 !important;
      border: none !important;
      width: 32px;
      height: 32px;
      min-width: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.45);
    }
    .coach-close-btn:hover {
      background: #dc2626 !important;
      background-color: #dc2626 !important;
      color: #000000 !important;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.6);
    }
    .coach-close-btn:active {
      transform: scale(0.95);
    }

    /* Rewrite All Weak button: Background same as card color, font color yellow */
    .btn-rewrite-all,
    .chat-chip.rewrite-chip {
      background: var(--card) !important;
      background-color: var(--card) !important;
      color: var(--am, #fbbf24) !important;
      border: 1px solid var(--bd) !important;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .btn-rewrite-all:hover,
    .chat-chip.rewrite-chip:hover {
      background: var(--bg2) !important;
      background-color: var(--bg2) !important;
      color: #fde047 !important;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: var(--card) !important;
      border: 1px solid var(--bd) !important;
      color: var(--am, #fbbf24) !important;
      border-bottom-right-radius: 4px;
    }

    /* Sidebar Rail Navigation */
    .evaluator-layout {
      display: flex;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    .rail {
      position: relative;
      z-index: 10;
      width: 108px;
      flex: none;
      padding: 24px 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-right: 1px solid var(--bd);
      background: var(--pn);
      backdrop-filter: blur(16px);
      animation: slideL 0.8s both;
    }
    .nv {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 6px;
      border-radius: 16px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--mu);
      cursor: pointer;
      transition: all 0.28s ease;
      border: 1px solid transparent;
      user-select: none;
    }
    .nv:hover {
      transform: translateX(4px);
      color: var(--tx);
      background: rgba(255, 255, 255, 0.04);
    }
    .nv.active,
    .nv:has(input:checked) {
      color: var(--c);
      border-color: var(--c);
      background: rgba(34, 211, 238, 0.12);
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.15);
    }
    .nv input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
    }
    .nv svg {
      transition: transform 0.25s ease;
    }
    .nv:hover svg {
      transform: scale(1.1);
    }

    /* Header & Top Bar */
    .main {
      position: relative;
      z-index: 1;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 22px clamp(16px, 3vw, 40px);
      border-bottom: 1px solid var(--bd);
      background: rgba(19, 3, 6, 0.4);
      backdrop-filter: blur(12px);
      animation: rise 0.7s both;
    }
    .r.light .top {
      background: rgba(238, 248, 255, 0.6);
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.04em;
    }
    .ttl {
      font-size: 14px;
      font-weight: 700;
      color: var(--c);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .big {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.2;
    }
    .hint {
      font-size: 14px;
      color: var(--mu);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--bd);
      border-radius: 99px;
      padding: 7px 16px;
      font-size: 14px;
      font-weight: 700;
      background: var(--pn);
      backdrop-filter: blur(8px);
      color: inherit;
      text-decoration: none;
      transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
    }
    .chip[for], a.chip, button.chip {
      cursor: pointer;
    }
    .chip:hover {
      transform: translateY(-2px);
      border-color: var(--c);
    }
    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--g);
      animation: pulse 1.8s infinite;
    }

    /* Toggle Switch */
    input.sw {
      appearance: none;
      width: 56px;
      height: 30px;
      border-radius: 99px;
      border: 1px solid var(--bd);
      background: var(--pn);
      position: relative;
      cursor: pointer;
      margin: 0;
      outline: none;
      transition: background 0.3s ease;
    }
    input.sw::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--c);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.3s ease;
    }
    input.sw:checked::after {
      transform: translateX(26px);
      background: #f59e0b;
    }

    /* Panels & Glassmorphic Cards */
    .pg {
      max-width: 1140px;
      width: 100%;
      margin: 0 auto;
      padding: 32px clamp(16px, 3vw, 40px) 90px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .pn {
      position: relative;
      border: 1px solid var(--bd);
      border-radius: 22px;
      background: var(--pn);
      backdrop-filter: blur(14px);
      padding: 26px;
      animation: rise 0.8s calc(var(--d, 0) * 0.1s) cubic-bezier(0.16, 1, 0.3, 1) backwards;
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .pn:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
      border-color: rgba(255, 140, 150, 0.4);
    }
    .pn::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 22px;
      padding: 1px;
      background: conic-gradient(from var(--a), transparent 55%, var(--c), var(--g), transparent);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0;
      transition: opacity 0.4s;
      animation: spin 5s linear infinite;
      pointer-events: none;
    }
    .pn:hover::before {
      opacity: 0.8;
    }
    .lb {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--mu);
      margin-bottom: 14px;
      display: block;
      letter-spacing: 0.05em;
    }
    .h2 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--tx), var(--c), var(--tx));
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: sheen 7s linear infinite;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
    }
    .row span:last-child {
      color: var(--mu);
      font-weight: 500;
    }
    .g4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }
    .g2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
    }

    /* Score Ring */
    .rg {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 6px auto 14px;
    }
    .rg::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: conic-gradient(var(--c), transparent 40%, var(--g), transparent);
      filter: blur(14px);
      opacity: 0.45;
      animation: rot 6s linear infinite;
    }
    .rg svg {
      transform: rotate(-90deg);
      position: relative;
      z-index: 1;
    }
    .rg .arc {
      stroke-dasharray: 339.29;
      transform-origin: center;
      transition: stroke-dashoffset 1.4s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.5s ease;
    }
    .rg b {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      text-align: center;
      font-size: 38px;
      line-height: 1;
      z-index: 1;
    }
    .rg small {
      font-size: 14px;
      color: var(--mu);
      font-weight: 500;
    }
    .tier {
      display: block;
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      border-radius: 99px;
      padding: 5px 12px;
      animation: bob 3.5s infinite;
      border: 1px solid currentColor;
    }

    /* Percentage Bars (Color Coded) */
    .bar {
      height: 10px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
      margin: 10px 0 8px;
    }
    .r.light .bar,
    .r:has(#th:checked) .bar {
      background: rgba(8, 60, 90, 0.12);
    }
    .bar i {
      display: block;
      height: 100%;
      width: var(--w, 0%);
      border-radius: 9px;
      transform-origin: left;
      animation: grow 1.4s calc(0.3s + var(--d, 0) * 0.12s) cubic-bezier(0.16, 1, 0.3, 1) both;
      background: linear-gradient(90deg, var(--c), var(--g));
      position: relative;
      overflow: hidden;
      transition: width 1s ease-out;
    }
    .bar i::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
      animation: slideSh 2.8s 1.8s infinite;
    }
    .bar.am i {
      background: linear-gradient(90deg, var(--am), #fde68a) !important;
    }
    .bar.rd i {
      background: linear-gradient(90deg, var(--rd), #fda4af) !important;
    }

    /* Input & Preset Components */
    .drop {
      border: 2px dashed var(--bd);
      border-radius: 18px;
      padding: 40px 20px;
      text-align: center;
      transition: all 0.3s ease;
      cursor: pointer;
      animation: pulseB 3s infinite;
      background: rgba(0, 0, 0, 0.15);
    }
    .drop:hover, .drop.active {
      border-color: var(--c);
      background: rgba(34, 211, 238, 0.08);
      transform: scale(1.01);
    }
    .ps {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 16px 18px;
      border: 1px solid var(--bd);
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.3s ease;
      animation: slideR 0.7s calc(0.15s + var(--i) * 0.1s) both;
      background: rgba(255, 255, 255, 0.02);
    }
    .ps input {
      position: absolute;
      inset: 0;
      opacity: 0;
      margin: 0;
      cursor: pointer;
    }
    .ps:hover {
      transform: translateX(4px);
      border-color: var(--c);
    }
    .ps.checked,
    .ps:has(input:checked) {
      background: linear-gradient(90deg, rgba(34, 211, 238, 0.25), rgba(74, 222, 128, 0.2));
      border-color: var(--c);
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.18);
    }

    .btn {
      border: 0;
      border-radius: 99px;
      padding: 14px 28px;
      font: 800 16px 'Plus Jakarta Sans', sans-serif;
      color: #021419;
      background: linear-gradient(90deg, #22d3ee, #4ade80);
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      min-height: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn:hover {
      transform: scale(1.04) translateY(-2px);
      box-shadow: 0 10px 24px rgba(34, 211, 238, 0.3);
    }
    .btn.lbl {
      display: block;
      text-align: center;
      box-sizing: border-box;

    /* ==========================================================================
       AI COACH STATE REDUCER (Preserves 100% test contract from test_chat_reducer.js)
       ========================================================================== */
    const initialCoachState = {
      isOpen: false,
      isMinimized: false,
      messages: [],
      isTyping: false,
      bulletIndex: 0,
      activeTone: 'impact',
      isLoadingRewrites: false,
      activeRewrites: null,
      batchProgress: 0,
      batchResults: [],
      jdKeywords: [],
      step: 'idle',
    };

    function coachReducer(state, action) {
      switch (action.type) {
        case 'OPEN':
          return { ...state, isOpen: true, isMinimized: false, step: state.step === 'idle' ? 'greeting' : state.step };
        case 'CLOSE':
          return { ...state, isOpen: false };
        case 'TOGGLE_MINIMIZE':
          return { ...state, isMinimized: !state.isMinimized };
        case 'SET_TYPING':
          return { ...state, isTyping: action.payload };
        case 'ADD_MESSAGE':
          return {
            ...state,
            messages: [
              ...state.messages,
              { id: 'm-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4), ...action.payload },
            ],
          };
        case 'START_BULLET_FLOW':
          return {
            ...state,
            bulletIndex: action.payload.index,
            step: 'picking_tone',
            activeRewrites: null,
          };
        case 'SET_TONE':
          return {
            ...state,
            activeTone: action.payload,
            step: 'loading',
          };
        case 'RECEIVE_REWRITES':
          return {
            ...state,
            isLoadingRewrites: false,
            isTyping: false,
            activeRewrites: action.payload,
            step: 'showing_rewrites',
          };
        case 'ACCEPT_REWRITE':
          return {
            ...state,
            step: 'accepted',
          };
        case 'NEXT_BULLET':
          return {
            ...state,
            bulletIndex: action.payload.nextIndex,
            step: action.payload.hasNext ? 'picking_tone' : 'done',
            activeRewrites: null,
          };
        case 'SET_BATCH_PROGRESS':
          return {
            ...state,
            batchProgress: action.payload.progress,
            batchResults: action.payload.results || state.batchResults,
          };
        case 'RESET':
          return { ...initialCoachState, isOpen: state.isOpen };
        default:
          return state;
      }
    }

    function getBarColorClass(pct) {
      if (pct < 45) return 'rd'; // low -> red
      if (pct < 75) return 'am'; // normal -> yellowish mustard

    }

        if (mainIdx !== -1) {

                index: idx + 1,

                issue: whyWeak,
                rewritten: rewrittenText,
                whatImproved: whyBetter,
                impactBefore,

                role: 'bot',
                type: 'batch_breakdown',

                              </div>
                            ))}

                            {/* Green Glassmorphic Download Updated PDF CTA */}
                            <div style={{ marginTop: '10px', paddingTop: '10px', borderTop: '1px solid var(--bd)', display: 'flex', justifyContent: 'center' }}>
                              <button
                                className="btn-glass-green"
                                onClick={handleExportPDF}
                                style={{ padding: '9px 18px', fontSize: '12.5px', width: '100%', justifyContent: 'center' }}
                                disabled={isExportingPDF}
                              >
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                  <polyline points="14 2 14 8 20 8"/>
                                  <line x1="12" y1="18" x2="12" y2="12"/>
                                  <line x1="9" y1="15" x2="15" y2="15"/>
                                </svg>
                                <span>{isExportingPDF ? "Exporting PDF..." : "📄 Download Updated ATS PDF →"}</span>
                              </button>
                            </div>
                          </div>
                        )}

                        {m.type === 'bullet_preview' && (
                          <div className="bullet-card">
                            <b style={{ color: 'var(--am)', fontSize: '12px', display: 'block', marginBottom: '4px' }}>
                              Original Statement:
                            </b>
                            "{m.payload.bullet}"
                            <div style={{ fontSize: '12px', color: 'var(--rd)', marginTop: '4px' }}>
                              ⚠️ {m.payload.issue}
                            </div>
                          </div>
                        )}

                        {m.type === 'rewrites' && (
                          <div style={{ marginTop: '8px' }}>
                            <div style={{ fontSize: '12.5px', color: 'var(--mu)', marginBottom: '6px' }}>
                              Select an optimized alternative:
                            </div>
                            {m.payload.rewrites.map((rw, rwIdx) => (
                              <div key={rwIdx} className="rewrite-opt">
                                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
                                  <span style={{ fontWeight: 800, color: 'var(--g)', fontSize: '12px' }}>
                                    {rw.style || 'Optimized'}
                                  </span>
                                  <span className="chip mono" style={{ fontSize: '11px', padding: '2px 8px' }}>
                                    Impact {rw.impact_score || 9}/10
                                  </span>
                                </div>
                                <div style={{ color: 'var(--tx)', marginBottom: '8px' }}>
                                  "{rw.text}"
                                </div>
                                <button
                                  className="btn"
                                  style={{ width: '100%', padding: '6px 12px', fontSize: '12px', minHeight: '32px' }}
                                  onClick={() => handleAcceptRewrite(rw.text, coachState.bulletIndex)}
                                >
                                  ✓ Accept &amp; Upgrade Score (+3 pts)
                                </button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}

                    {/* Typing Indicator */}
                    {coachState.isTyping && (
                      <div className="typing-indicator" style={{ alignSelf: 'flex-start' }}>
                        <span></span><span></span><span></span>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Fixed Chatbot Footer & Input */}
                  <div className="cp-footer">
                    <form className="chat-input-row" onSubmit={handleSendChat}>
                      <input
                        type="text"
                        className="chat-input"
                        placeholder="Ask coach or paste any bullet point..."
                        value={chatInputText}
                        onChange={(e) => setChatInputText(e.target.value)}
                      />
                      <button type="submit" className="chat-send-btn" title="Send">
                        ➔
                      </button>
                    </form>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '8px' }}>
                      <button
                        className="btn-glass-green"
                        style={{ padding: '6px 14px', fontSize: '12px' }}
                        onClick={handleExportPDF}
                        disabled={isExportingPDF}
                        title="Download Updated ATS CV as PDF"
                      >
                        📄 Download PDF
                      </button>
                      <button
                        className="btn-rewrite-all"
                        style={{
                          border: '1px solid var(--bd)',
                          borderRadius: '99px',
                          padding: '6px 14px',
                          fontSize: '12px',
                          cursor: 'pointer',
                          display: 'inline-flex',
                          alignItems: 'center',
                          gap: '6px'
                        }}
                        onClick={handleRewriteAll}
                      >
                        ⚡ Rewrite All Weak
                      </button>
                    </div>
                  </div>
                </aside>
              )}
            </div>
          )}
        </div>
      );
    }

    // Mount Root React Component
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
