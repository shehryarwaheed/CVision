<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CVision: Explainable AI CV Evaluator</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            deepNavy: '#05161A',
            panelNavy: '#08252C',
            surfaceNavy: '#0B3039',
            cardNavy: '#0E3C47',
            electricCyan: '#00F0FF',
            neonTeal: '#0CECDD'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');
    * {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease, box-shadow 0.2s ease;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(14, 165, 233, 0.4);
      border-radius: 9999px;
    }
    .score-circle {
      stroke-dasharray: 283;
      stroke-dashoffset: calc(283 - (283 * var(--score-val, 86)) / 100);
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-sky-100 text-slate-800 antialiased selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo } = React;

    const PRESETS = {
      senior: {
        name: "Senior Full-Stack Engineer",
        role: "Software Developer",
        score: 86,
        tier: "Excellent Tier",
        confidence: "92.4%",
        skillsFound: 14,
        totalSkills: 18,
        tipsCount: 2,
        fileName: "Alex_Rivera_Staff_Software_Engineer_2024.pdf",
        fileSize: "248 KB",
        topRoles: [
          { name: "Software Developer", prob: 92.4, isTop: true },
          { name: "Information Technology", prob: 4.2 },
          { name: "Data Science / Analytics", prob: 1.8 },
          { name: "Operations", prob: 1.0 },
          { name: "Consultant", prob: 0.6 }
        ],
        attribution: "Strong concentration of system architecture vocabulary, containerization patterns, and high ratio of quantified engineering deliverables (APIs, scale, latency).",
        breakdown: [
          { title: "Quantified Impact", score: 26, max: 30, desc: "24% sentences contain metric numbers. Target: 25%" },
          { title: "Section Completeness", score: 30, max: 30, desc: "5/5 key sections present: Experience, Education, Skills, Summary, Projects" },
          { title: "Action Verb Density", score: 16, max: 20, desc: "4.2 action verbs per 100 words. Target: 3.5" },
          { title: "Lexical Diversity", score: 14, max: 20, desc: "Score 0.46 across first 300 words. Target: 0.50" }
        ],
        strengths: ["Solid architectural vocabulary with recognized IEEE headings.", "High impact metrics across senior positions."],
        improvements: ["Add target user adoption metrics to the open-source projects section."],
        actionItem: "Upgrade 2 passive verbs ('managed team', 'assisted in') to definitive engineering verbs ('orchestrated', 'spearheaded').",
        skillsDetected: ["Python", "React", "Docker", "SQL", "TypeScript", "REST APIs", "FastAPI", "Kubernetes", "Redis", "Git", "Microservices", "GraphQL", "TailwindCSS", "Node.js"],
        skillsMissing: ["Terraform", "AWS Lambda", "Kafka", "Prometheus"],
        stats: { words: 742, sentences: 38, numbers: 18, verbs: 31, readability: "Grade 11.2" }
      },
      finance: {
        name: "Financial Analyst",
        role: "Finance / Banking",
        score: 68,
        tier: "Good Tier",
        confidence: "84.1%",
        skillsFound: 11,
        totalSkills: 16,
        tipsCount: 3,
        fileName: "Morgan_Chen_Financial_Modeling_Analyst.pdf",
        fileSize: "182 KB",
        topRoles: [
          { name: "Finance / Banking", prob: 84.1, isTop: true },
          { name: "Consultant", prob: 8.6 },
          { name: "Operations", prob: 4.1 },
          { name: "Data Science / Analytics", prob: 2.2 },
          { name: "Sales / BD", prob: 1.0 }
        ],
        attribution: "Frequent occurrences of variance analysis, DCF modeling, P&L reporting, and institutional audit terminology.",
        breakdown: [
          { title: "Quantified Impact", score: 22, max: 30, desc: "19% sentences contain metric figures ($ amounts, % ROI). Target: 25%" },
          { title: "Section Completeness", score: 25, max: 30, desc: "4/5 sections present. Consider adding Certifications / CFA section." },
          { title: "Action Verb Density", score: 12, max: 20, desc: "2.8 action verbs per 100 words. Target: 3.5" },
          { title: "Lexical Diversity", score: 9, max: 20, desc: "Score 0.38 across first 300 words. Repetitive phrasing in bullet points." }
        ],
        strengths: ["Strong valuation metrics and clear dollar scale of analyzed funds.", "Consistent chronology."],
        improvements: ["Expand on quantitative toolsets beyond Excel (SQL, PowerBI, Python)."],
        actionItem: "Replace passive reporting descriptions with portfolio outcome statements.",
        skillsDetected: ["Financial Modeling", "DCF", "Excel VBA", "Budgeting", "Variance Analysis", "Bloomberg Terminal", "Accounting", "PowerPoint", "Forecasting", "Audit Prep", "P&L Analysis"],
        skillsMissing: ["SQL Data Pulls", "Tableau / PowerBI", "Python for Finance", "Capital Markets Risk", "ERP SAP"],
        stats: { words: 580, sentences: 31, numbers: 24, verbs: 19, readability: "Grade 12.0" }
      },
      hr: {
        name: "HR Coordinator",
        role: "Human Resources",
        score: 44,
        tier: "Needs Work",
        confidence: "71.5%",
        skillsFound: 7,
        totalSkills: 15,
        tipsCount: 5,
        fileName: "Taylor_Smith_HR_Coordinator_Resume.pdf",
        fileSize: "140 KB",
        topRoles: [
          { name: "Human Resources", prob: 71.5, isTop: true },
          { name: "Operations", prob: 16.2 },
          { name: "Consultant", prob: 6.8 },
          { name: "Public Relations", prob: 3.5 },
          { name: "Sales / BD", prob: 2.0 }
        ],
        attribution: "Identified onboarding, ATS screening, and employee engagement terms. Low presence of quantified throughput or retention stats.",
        breakdown: [
          { title: "Quantified Impact", score: 8, max: 30, desc: "Only 6% sentences contain numbers. Far below the 25% target." },
          { title: "Section Completeness", score: 18, max: 30, desc: "Missing dedicated Skills Taxonomy & KPI Projects section." },
          { title: "Action Verb Density", score: 9, max: 20, desc: "1.9 verbs per 100 words. Many passive duties ('Responsible for')." },
          { title: "Lexical Diversity", score: 9, max: 20, desc: "Score 0.32. Heavy repetition of 'coordinated' and 'handled'." }
        ],
        strengths: ["Clean chronological layout with contact details verified.", "Good breadth of HR functions mentioned."],
        improvements: ["Add recruitment metrics: time-to-hire, headcount expanded, or retention rates.", "Differentiate between compliance and people-ops contributions."],
        actionItem: "Rewrite 'Responsible for organizing onboarding' to 'Orchestrated seamless 3-day onboarding program for 85+ hires'.",
        skillsDetected: ["Workday", "Onboarding", "Benefits Admin", "Interview Scheduling", "HRIS", "Compliance", "Employee Relations"],
        skillsMissing: ["Talent Analytics", "Greenhouse / Lever", "Compensation Benchmarking", "Employer Branding", "DEI Metrics", "Performance Management", "Excel Advanced", "Labor Law Compliance"],
        stats: { words: 410, sentences: 24, numbers: 4, verbs: 12, readability: "Grade 9.8" }
      }
    };

    function App() {
      const [isDark, setIsDark] = useState(true);
      const [activePresetKey, setActivePresetKey] = useState("senior");
      const [activeTab, setActiveTab] = useState("roles"); // 'roles' | 'breakdown' | 'skills' | 'parsed'
      const [modelType, setModelType] = useState("dual");
      const [isEvaluating, setIsEvaluating] = useState(false);
      const [showReportModal, setShowReportModal] = useState(false);
      const [customData, setCustomData] = useState(null);
      const [uploadedFile, setUploadedFile] = useState(null);
      const [isDragging, setIsDragging] = useState(false);

      const activeData = useMemo(() => customData || PRESETS[activePresetKey], [customData, activePresetKey]);

      const handlePresetChange = (key) => {
        setIsEvaluating(true);
        setCustomData(null);
        setUploadedFile(null);
        setTimeout(() => {
          setActivePresetKey(key);
          setIsEvaluating(false);
        }, 320);
      };

      const handleFileSelect = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadedFile(file);
        await uploadAndEvaluate(file);
      };

      const uploadAndEvaluate = async (file) => {
        setIsEvaluating(true);
        try {
          const formData = new FormData();
          formData.append("file", file);
          formData.append("model", modelType);
          const resp = await fetch("/api/analyze", { method: "POST", body: formData });
          if (resp.ok) {
            const data = await resp.json();
            setCustomData(data);
          } else {
            console.warn("API response error, falling back to preset");
          }
        } catch (err) {
          console.warn("Live backend unreachable, using preset preview", err);
        } finally {
          setIsEvaluating(false);
        }
      };

      const handleRunEval = async () => {
        if (uploadedFile) {
          await uploadAndEvaluate(uploadedFile);
        } else {
          setIsEvaluating(true);
          setTimeout(() => {
            setIsEvaluating(false);
          }, 600);
        }
      };

      return (
        <div className={`min-h-screen font-sans transition-colors duration-200 ${isDark ? 'dark bg-[#05161A] text-slate-100' : 'bg-sky-100 text-slate-800'}`}>
          {/* Header */}
          <header className={`sticky top-0 z-40 border-b backdrop-blur-md px-6 py-3.5 transition-colors ${
            isDark 
              ? 'bg-[#05161A]/90 border-cyan-900/40 text-white' 
              : 'bg-white/95 border-sky-200/80 shadow-sm text-slate-900'
          }`}>
            <div className="max-w-[1720px] mx-auto flex items-center justify-between">
              {/* Brand */}
              <div className="flex items-center gap-3.5">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center shadow-lg font-bold text-lg ${
                  isDark 
                    ? 'bg-gradient-to-tr from-cyan-500 to-teal-400 text-[#05161A] shadow-cyan-500/20' 
                    : 'bg-gradient-to-tr from-blue-700 to-sky-500 text-white shadow-blue-500/20'
                }`}>
                  <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M12 2L14.4 7.2L20 8L16 12.1L17 17.8L12 15L7 17.8L8 12.1L4 8L9.6 7.2L12 2Z" />
                  </svg>
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <span className="font-extrabold tracking-tight text-xl">CVision</span>
                    <span className={`text-[10px] uppercase font-mono px-2 py-0.5 rounded-full font-bold border ${
                      isDark 
                        ? 'bg-cyan-500/10 border-cyan-400/30 text-cyan-300' 
                        : 'bg-sky-100 border-sky-300 text-sky-800'
                    }`}>
                      v2.4
                    </span>
                  </div>
                  <p className={`text-xs ${isDark ? 'text-cyan-200/60' : 'text-slate-500'}`}>
                    Deliverable 3 • Track A: Explainable AI CV Evaluator
                  </p>
                </div>
              </div>

              {/* Status & Actions */}
              <div className="flex items-center gap-3">
                {/* Engine Status */}
                <div className={`hidden md:flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs font-mono font-medium ${
                  isDark 
                    ? 'bg-[#08252C] border-cyan-500/30 text-cyan-300' 
                    : 'bg-white border-sky-200 text-slate-700 shadow-sm'
                }`}>
                  <span className="relative flex h-2 w-2">
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                  </span>
                  <span>PyTorch Engine: Online</span>
                </div>

                {/* Theme Toggle Button */}
                <button
                  onClick={() => setIsDark(!isDark)}
                  title={isDark ? "Switch to Sky Blue Light Mode" : "Switch to #05161A Dark Mode"}
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-xl border text-xs font-semibold shadow-sm transition-all active:scale-95 ${
                    isDark
                      ? 'bg-gradient-to-r from-cyan-400 to-teal-300 text-[#05161A] border-cyan-300 hover:brightness-110'
                      : 'bg-slate-900 text-white border-slate-800 hover:bg-slate-800'
                  }`}
                >
                  {isDark ? (
                    <>
                      <svg className="w-4 h-4 text-[#05161A]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" strokeWidth="2"/>
                        <path strokeWidth="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                      </svg>
                      <span>Sky Light Mode</span>
                    </>
                  ) : (
                    <>
                      <svg className="w-4 h-4 text-cyan-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeWidth="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                      </svg>
                      <span>Teal Dark Mode</span>
                    </>
                  )}
                </button>

                {/* Tech Report Modal Trigger */}
                <button
                  onClick={() => setShowReportModal(true)}
                  className={`flex items-center gap-1.5 px-3 py-1.5 rounded-xl border text-xs font-medium transition ${
                    isDark
                      ? 'bg-[#08252C] hover:bg-[#0B3039] border-cyan-800/40 text-cyan-200'
                      : 'bg-white hover:bg-sky-50 border-sky-200 text-slate-700 shadow-sm'
                  }`}
                >
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                  </svg>
                  <span>Tech Report</span>
                </button>

                {/* Reset */}
                <button
                  onClick={() => handlePresetChange("senior")}
                  title="Reset to default evaluation state"
                  className={`p-1.5 rounded-xl border transition ${
                    isDark
                      ? 'border-cyan-900/40 text-cyan-400/80 hover:bg-[#08252C] hover:text-cyan-200'
                      : 'border-sky-200 text-slate-600 hover:bg-sky-50 shadow-sm'
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                  </svg>
                </button>
              </div>
            </div>
          </header>

          {/* Main Layout */}
          <main className="max-w-[1720px] mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            {/* Left Column: Input, Controls & Presets */}
            <aside className="lg:col-span-4 xl:col-span-3 space-y-5">
              
              {/* Viva Demo Presets (High-Contrast Menu) */}
              <div className={`p-4 rounded-2xl border transition-all ${
                isDark 
                  ? 'bg-[#08252C] border-cyan-800/40 shadow-xl shadow-cyan-950/20' 
                  : 'bg-white border-sky-200 shadow-md'
              }`}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-amber-500 font-bold">⚡</span>
                    <h2 className="text-xs font-bold uppercase tracking-wider font-mono">Viva Demo Presets</h2>
                  </div>
                  <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full font-bold uppercase ${
                    isDark ? 'bg-cyan-500/10 text-cyan-300 border border-cyan-500/20' : 'bg-sky-100 text-sky-800 border border-sky-200'
                  }`}>
                    Instant Click
                  </span>
                </div>
                
                {/* Preset List */}
                <div className="space-y-2">
                  {[
                    { key: "senior", icon: "💻", title: "Senior Full-Stack Engineer", subtitle: "Software Developer", score: "86/100" },
                    { key: "finance", icon: "📊", title: "Financial Analyst", subtitle: "Finance / Banking", score: "68/100" },
                    { key: "hr", icon: "🤝", title: "HR Coordinator", subtitle: "Human Resources", score: "44/100" }
                  ].map((p) => {
                    const isSelected = activePresetKey === p.key;
                    return (
                      <button
                        key={p.key}
                        onClick={() => handlePresetChange(p.key)}
                        className={`w-full text-left p-3 rounded-xl border flex items-center justify-between transition-all group ${
                          isSelected
                            ? isDark
                              ? 'bg-gradient-to-r from-cyan-400 to-teal-300 text-[#05161A] border-cyan-300 font-semibold shadow-md shadow-cyan-400/20 scale-[1.01]'
                              : 'bg-slate-900 text-white border-slate-800 shadow-lg scale-[1.01]'
                            : isDark
                              ? 'bg-[#0B3039]/70 hover:bg-[#0E3C47] border-cyan-900/30 text-cyan-100/90'
                              : 'bg-sky-50/70 hover:bg-sky-100 border-sky-100 text-slate-800'
                        }`}
                      >
                        <div className="flex items-center gap-2.5 min-w-0">
                          <span className="text-base">{p.icon}</span>
                          <div className="truncate">
                            <p className="text-xs font-bold truncate leading-snug">{p.title}</p>
                            <p className={`text-[11px] truncate ${
                              isSelected 
                                ? isDark ? 'text-[#05161A]/80 font-medium' : 'text-sky-200' 
                                : isDark ? 'text-cyan-300/60' : 'text-slate-500'
                            }`}>{p.subtitle}</p>
                          </div>
                        </div>
                        <span className={`text-xs font-mono font-bold px-2 py-1 rounded-md shrink-0 ml-2 ${
                          isSelected
                            ? isDark 
                              ? 'bg-[#05161A] text-cyan-300' 
                              : 'bg-sky-400 text-slate-950'
                            : isDark
                              ? 'bg-[#08252C] text-cyan-200'
                              : 'bg-white text-slate-700 border border-sky-200 shadow-sm'
                        }`}>
                          {p.score}
                        </span>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* Resume Input Zone */}
              <div className={`p-4 rounded-2xl border ${
                isDark 
                  ? 'bg-[#08252C] border-cyan-800/40' 
                  : 'bg-white border-sky-200 shadow-sm'
              }`}>
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-cyan-400">📤</span>
                    <h2 className="text-xs font-bold uppercase tracking-wider font-mono">Resume Input</h2>
                  </div>
                  <span className={`text-[10px] font-mono ${isDark ? 'text-cyan-300/60' : 'text-slate-500'}`}>
                    PDF, DOCX, TXT
                  </span>
                </div>

                {/* Hidden File Input */}
                <input
                  type="file"
                  id="cvFileInput"
                  accept=".pdf,.txt"
                  className="hidden"
                  onChange={handleFileSelect}
                />

                {/* Dropzone with Native Drag-and-Drop */}
                <div
                  onClick={() => document.getElementById("cvFileInput")?.click()}
                  onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); }}
                  onDragEnter={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(true); }}
                  onDragLeave={(e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); }}
                  onDrop={async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    setIsDragging(false);
                    const file = e.dataTransfer.files?.[0];
                    if (file) {
                      setUploadedFile(file);
                      await uploadAndEvaluate(file);
                    }
                  }}
                  className={`border-2 border-dashed rounded-xl p-5 text-center cursor-pointer transition ${
                  isDragging
                    ? isDark
                      ? 'border-cyan-300 bg-cyan-500/20 ring-2 ring-cyan-400'
                      : 'border-blue-600 bg-blue-100 ring-2 ring-blue-500'
                    : isDark
                      ? 'border-cyan-500/30 bg-[#0B3039]/40 hover:bg-[#0B3039]/80 hover:border-cyan-400'
                      : 'border-sky-300 bg-sky-50/50 hover:bg-sky-100 hover:border-blue-500'
                }`}>
                  <div className="w-10 h-10 mx-auto rounded-full flex items-center justify-center mb-2 bg-cyan-500/10 text-cyan-400">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
                    </svg>
                  </div>
                  <p className="text-xs font-semibold">Drop candidate CV or <span className="text-cyan-500 underline font-bold">Browse</span></p>
                  <p className={`text-[10px] mt-1 ${isDark ? 'text-cyan-200/50' : 'text-slate-500'}`}>Max file size: 10MB</p>
                </div>

                {/* Uploaded File Chip */}
                <div className={`mt-3 p-2.5 rounded-xl border flex items-center justify-between ${
                  isDark
                    ? 'bg-[#05161A] border-cyan-500/20 text-cyan-200'
                    : 'bg-sky-50 border-sky-200 text-slate-800'
                }`}>
                  <div className="flex items-center gap-2 min-w-0">
                    <svg className="w-4 h-4 text-cyan-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                    <span className="text-xs font-mono font-medium truncate">{activeData.fileName}</span>
                  </div>
                  <span className={`text-[10px] font-mono shrink-0 ml-2 ${isDark ? 'text-cyan-300/60' : 'text-slate-500'}`}>
                    {activeData.fileSize}
                  </span>
                </div>

                {/* Collapsible raw text notice */}
                <button className={`w-full mt-3 text-left flex items-center justify-between text-xs font-medium py-1 px-1 transition ${
                  isDark ? 'text-cyan-300/70 hover:text-cyan-200' : 'text-sky-800 hover:text-sky-950'
                }`}>
                  <span>Or Paste Raw Resume Text</span>
                  <span>›</span>
                </button>
              </div>

              {/* Inference Selector */}
              <div className={`p-4 rounded-2xl border ${
                isDark 
                  ? 'bg-[#08252C] border-cyan-800/40' 
                  : 'bg-white border-sky-200 shadow-sm'
              }`}>
                <h2 className="text-xs font-bold uppercase tracking-wider font-mono mb-3">Inference Architecture</h2>

                          ? 'bg-[#05161A] border-cyan-900/30 text-cyan-200/80' 
                          : 'bg-slate-50 border-slate-200 text-slate-700'
                      }`}>
{`[PARSED HEADER]: ${activeData.name} | Role: ${activeData.role}
[SECTIONS DETECTED]: Summary (present), Work Experience (5 roles), Education (B.S.), Skills (14 tokens), Projects (3 items).
[SAMPLE EXTRACT]: Led architecture and deployment of high-throughput services handling 45k req/sec with 99.98% uptime SLA. Built CI/CD pipelines using Docker and Kubernetes. Reduced compute expenditure by 28% over 14 months.`}
                      </pre>
                    </div>
                  </div>
                )}

              </div>

              {/* Bottom Footer Bar */}
              <div className={`p-4 rounded-2xl border flex flex-col sm:flex-row items-center justify-between gap-3 text-xs ${
                isDark 
                  ? 'bg-[#08252C]/70 border-cyan-800/40 text-cyan-200/60' 
                  : 'bg-white border-sky-200 text-slate-600 shadow-sm'
              }`}>
                <div className="flex items-center gap-2">
                  <span className="h-2 w-2 rounded-full bg-cyan-400"></span>
                  <span>Evaluated against IEEE/ACM Software & Domain Taxonomy</span>
                </div>
                <div className="flex items-center gap-3">
                  <button className={`font-mono font-medium hover:underline ${isDark ? 'text-cyan-300' : 'text-blue-900'}`}>
                    Export JSON Diagnostic
                  </button>
                  <button className={`px-3 py-1 rounded-lg font-bold text-xs ${
                    isDark ? 'bg-cyan-400 text-[#05161A]' : 'bg-slate-900 text-white'
                  }`}>
                    View Viva Spec
                  </button>
                </div>
              </div>

            </section>
          </main>

          {/* Technical Report Modal */}
          {showReportModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className={`w-full max-w-xl rounded-2xl border p-6 shadow-2xl space-y-4 ${
                isDark ? 'bg-[#08252C] border-cyan-500/40 text-white' : 'bg-white border-sky-200 text-slate-900'
              }`}>
                <div className="flex items-center justify-between border-b pb-3 border-cyan-900/30">
                  <h3 className="font-extrabold text-lg flex items-center gap-2">
                    <span>📑</span> Technical Report & Model Architecture
                  </h3>
                  <button 
                    onClick={() => setShowReportModal(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>
                <div className="text-xs space-y-3 leading-relaxed">
                  <p><strong>Deliverable 3:</strong> Explainable AI CV Evaluator (Track A - Application Development).</p>
                  <p><strong>Model Weights:</strong> Dual-Branch neural network combining Bi-LSTM text embeddings (256-dim) with 13 hand-engineered dense linguistic and structural feature vectors.</p>
                  <p><strong>Scoring Algorithm:</strong> 0–100 composite index based on Quantified Impact (30%), Section Completeness (30%), Action Verb Density (20%), and Lexical Diversity (20%).</p>
                  <p><strong>Themes:</strong> Sky Blue Light Mode (`bg-sky-100` canvas with contrasting slate/navy controls) and #05161A Dark Mode (`bg-[#05161A]` with contrasting cyan/teal surfaces and highlights).</p>
                </div>
                <div className="pt-2 flex justify-end">
                  <button
                    onClick={() => setShowReportModal(false)}
                    className={`px-4 py-2 rounded-xl text-xs font-bold ${
                      isDark ? 'bg-cyan-400 text-[#05161A]' : 'bg-slate-900 text-white'
                    }`}
                  >
                    Close Report
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
